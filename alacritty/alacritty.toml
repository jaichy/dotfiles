[colors.bright]
black = "0x5c6773"
blue = "0x41a6d9"
cyan = "0x95e6cb"
green = "0x86b300"
magenta = "0xf07178"
red = "0xff3333"
white = "0xffffff"
yellow = "0xf29718"

[colors.normal]
black = "0x0a0e14"
blue = "0x41a6d9"
cyan = "0x95e6cb"
green = "0x86b300"
magenta = "0xf07178"
red = "0xff3333"
white = "0xcbccc6"
yellow = "0xf29718"

[colors.primary]
background = "0x000000"
foreground = "0xb3b1ad"

[cursor]
style = "Beam"

[font]
size = 11.0

[font.normal]
family = "monospace"
style = "Regular"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Super"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Super"


[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Super"

[[keyboard.bindings]]
action = "Minimize"
key = "M"
mods = "Super"

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F"
mods = "Super"


[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Alt"

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F11"

[window]
padding.x = 10
padding.y = 10
decorations = "none"
opacity = 0.8
blur = true
