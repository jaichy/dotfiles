[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Super"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Super"

[[keyboard.bindings]]
action = "Minimize"
key = "M"
mods = "Super"

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F"
mods = "Super"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Alt"

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F11"