[colors.selection]
background = "0x321543"
text = "CellForeground"

[colors.normal]
black = "0x1c1e26"
red = "0xe95678"
green = "0x29d398"
yellow = "0xfab795"
blue = "0x26bbd9"
magenta = "0xee64ac"
cyan = "0x59e1e3"
white = "0xd5d8da"

[colors.bright]
black = "0x6c6f93"
red = "0xec6a88"
green = "0x3fdaa4"
yellow = "0xfbc3a7"
blue = "0x3fc4de"
magenta = "0xf075b5"
cyan = "0x6be4e6"
white = "0xffffff"

[cursor.style]
shape = "Beam"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
padding.x = 10
padding.y = 10
decorations = "none"
opacity = 0.8
blur = true

[[keyboard.bindings]]
action = "Paste"
key = "V"
