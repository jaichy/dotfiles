[main]
# font=JetBrainsMono Nerd Font:size=12
prompt="Launch: "
terminal=alacritty
icon-theme=default
width=60
lines=10
horizontal-pad=16
vertical-pad=16
inner-pad=8
line-height=20
layer=overlay
anchor=center
fields=name,generic,keywords
show-actions=yes
exit-on-keyboard-focus-loss=yes

[colors]
background=0e0e0eee
text=d5d8daffw
prompt=e95378ff
placeholder=6c6f93ff
input=d5d8daff
match=e95378ff
selection=2e303eff
selection-text=d5d8daff
selection-match=fb8b24ff
counter=6c6f93ff
border=e95378ff

[border]
width=2
radius=10

[key-bindings]
prev=Up Control+k
next=Down Control+j