$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgba(0e0e0eff)
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0e0e0e99)
    outer_color = rgba(e95378ee)
    check_color = rgba(29d398ee)
    fail_color = rgba(e95678ee)
    capslock_color = rgba(fab795ee)

    font_color = rgb(213, 216, 218)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text =   reboot
    color = rgba(fab795ff)
    font_size = 16
    font_family = $font
    position = -200, 80
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

label {
    monitor =
    text =   exit
    color = rgba(26bbd9ff)
    font_size = 16
    font_family = $font
    position = 0, 80
    halign = center
    valign = bottom
    onclick = setsid sh -c 'pkill -USR1 hyprlock; sleep 0.3; command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit'
}

label {
    monitor =
    text =   shutdown
    color = rgba(e95678ff)
    font_size = 16
    font_family = $font
    position = 200, 80
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}